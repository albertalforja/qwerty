<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Semantic HTML</title>
    <style>
      body {
        font-family: "Segoe UI", sans-serif;
        margin: 0;
        background: #f4f6f9;
      }

      header {
        background: #2c3e50;
        color: white;
        padding: 20px;
        text-align: center;
      }

      nav {
        background: #34495e;
        padding: 10px;
        text-align: center;
      }

      nav a {
        margin: 0 15px;
        color: white;
        text-decoration: none;
        font-weight: bold;
      }

      nav a:hover {
        color: #f1c40f;
      }

      main {
        padding: 30px;
        max-width: 1000px;
        margin: auto;
      }

      article {
        background: white;
        padding: 20px;
        margin-bottom: 20px;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(254, 2, 2, 0.1);
      }

      article h2 {
        margin-top: 0;
        color: #2c3e50;
      }

      footer {
        background: #2c3e50;
        color: white;
        text-align: center;
        padding: 15px;
        margin-top: 30px;
      }
    </style>
  </head>

  <body>
    <header>
      <h1>My Website</h1>
    </header>

    <nav>
      <a href="#">Home</a>
      <a href="#">About</a>
      <a href="#">Contact</a>
    </nav>

    <main>
      <section>
        <article>
          <h2>Article Title</h2>
          <p>This article uses proper semantic elements.</p>
        </article>

        <article>
          <h2>Another Article</h2>
          <p>Screen readers and search engines understand this structure.</p>
        </article>
      </section>
    </main>

    <footer>© 2026 My Website</footer>
    <video src=""></video>
  </body>
</html>
